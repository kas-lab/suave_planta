# Paths are resolved by the launch file through launch substitutions.
/wilcoxon_analysis:
  ros__parameters:
    result_path: '$(var output_root)/suave/exp3'
    filename: 'exp3_wilcoxon'
    correction: '$(var correction)'
    data_files:
      - |
        {
          "managing_system": "none",
          "data_file": "$(var results_root)/suave/exp3/none_suave_sorted.csv"
        }
      - |
        {
          "managing_system": "random",
          "data_file": "$(var results_root)/suave/exp3/random_suave_sorted.csv"
        }
      - |
        {
          "managing_system": "bt",
          "data_file": "$(var results_root)/suave/exp3/bt_suave_sorted.csv"
        }
      - |
        {
          "managing_system": "metacontrol",
          "data_file": "$(var results_root)/suave/exp3/metacontrol_suave_sorted.csv"
        }
      - |
        {
          "managing_system": "rosa_bt",
          "data_file": "$(var results_root)/suave/exp3/rosa_bt_suave_sorted.csv"
        }
      - |
        {
          "managing_system": "planta",
          "data_file": "$(var results_root)/suave/exp3/planta_suave_sorted.csv"
        }
